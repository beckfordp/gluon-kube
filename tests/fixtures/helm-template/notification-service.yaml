apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: gluon-local
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
# Source: gluon/templates/deployment.yaml
# SPDX-License-Identifier: MIT

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: gluon-local
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # Every service's own <NAME>_SERVICE_PORT env var (e.g.
      # CATALOG_SERVICE_PORT) collides with k8s's own auto-injected
      # Docker-links-style env vars for a Service named "catalog-service" —
      # k8s would inject CATALOG_SERVICE_PORT=tcp://<ip>:8080 (a URI
      # string), breaking pureconfig's NUMBER parse of our own same-named
      # var. Disable that injection; nothing here relies on it — every
      # cross-service address is passed explicitly via `env` instead.
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: "notification-service:latest"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=40"
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4318"
            - name: POSTGRES_HOST
              value: "notification-postgres"
            - name: POSTGRES_DB
              value: "notification"
            - name: POSTGRES_USER
              value: "notification"
            - name: POSTGRES_PASSWORD
              value: "notification"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: USER_SERVICE_URL
              value: "http://user-service:8080"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8080"
          # Startup (Flyway, Kafka group join) can take ~15s on a busy laptop;
          # the startup probe holds liveness off until the first success.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          # Generous timeout/threshold: at the 500m CPU limit a GC pause under
          # acceptance load can exceed 1s, and a liveness kill then takes the
          # service down mid-run.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 512Mi
