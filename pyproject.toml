# SPDX-License-Identifier: MIT

[project]
name = "gluon-kube"
version = "0.1.0"
description = "A simulated gluon-local for the sandbox (gluon ADR 0030)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Pinned exactly, as gluon-contract's. pyroute2 (decided in GK-1.2) comes with the
# first code that uses it (GK-4).
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
gluon-kube = "gluon_kube.cli:main"

[dependency-groups]
# Pinned exactly, as gluon-contract's: bump deliberately (conductor/tech-stack.md).
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["gluon_kube"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.13"
strict = true
# Not spikes/: the probe is a standalone uv script with its own dependencies.
files = ["src", "tests"]
