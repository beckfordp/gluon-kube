- apiVersion: batch/v1
  kind: Job
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"batch/v1","kind":"Job","metadata":{"annotations":{},"labels":{"app":"debezium-connector-register"},"name":"debezium-connector-register","namespace":"gluon-local"},"spec":{"backoffLimit":6,"template":{"metadata":{"labels":{"app":"debezium-connector-register"}},"spec":{"containers":[{"command":["sh","-c","set -eu\necho \"Waiting for kafka-connect REST API...\"\nattempt=0\nmax_attempts=36 # 36 * 5s = 3m\nuntil curl --fail --silent http://kafka-connect:8083/ \u003e /dev/null; do\n  attempt=$((attempt + 1))\n  if [ \"$attempt\" -ge \"$max_attempts\" ]; then\n    echo \"FAIL: kafka-connect never became reachable after ${max_attempts} attempts\" \u003e\u00262\n    exit 1\n  fi\n  sleep 5\ndone\nfor f in /connectors/*.json; do\n  name=$(basename \"$f\" .json)\n  echo \"Registering $name...\"\n  # PUT .../connectors/{name}/config is idempotent (create\n  # or update) - unlike POST /connectors, which 409s if the\n  # connector already exists. Matters because this Job can\n  # retry (backoffLimit) or be re-applied.\n  curl --fail --silent --show-error \\\n    -X PUT \\\n    -H \"Content-Type: application/json\" \\\n    --data \"@$f\" \\\n    \"http://kafka-connect:8083/connectors/$name/config\"\n  echo\ndone\n\n# TD-22: inventory no longer publishes; remove its retired\n# connector from existing clusters. 404 means already gone.\necho \"Removing retired inventory-outbox-connector...\"\ncode=$(curl --silent --output /dev/null --write-out '%{http_code}' \\\n  -X DELETE \\\n  \"http://kafka-connect:8083/connectors/inventory-outbox-connector\")\nif [ \"$code\" != \"204\" ] \u0026\u0026 [ \"$code\" != \"404\" ]; then\n  echo \"FAIL: deleting inventory-outbox-connector returned $code\" \u003e\u00262\n  exit 1\nfi\n"],"image":"curlimages/curl:8.10.1","name":"register","resources":{"limits":{"cpu":"100m","memory":"64Mi"},"requests":{"cpu":"50m","memory":"64Mi"}},"volumeMounts":[{"mountPath":"/connectors","name":"connectors"}]}],"restartPolicy":"OnFailure","volumes":[{"configMap":{"name":"debezium-outbox-connectors"},"name":"connectors"}]}}}}
    creationTimestamp: "2026-11-14T18:45:53Z"
    generation: 1
    labels:
      app: debezium-connector-register
    name: debezium-connector-register
    namespace: gluon-local
    resourceVersion: "768143"
    uid: 61f85cbe-b233-4eb1-9b49-e4864b4ed1f7
  spec:
    backoffLimit: 6
    completionMode: NonIndexed
    completions: 1
    manualSelector: false
    parallelism: 1
    podReplacementPolicy: TerminatingOrFailed
    selector:
      matchLabels:
        batch.kubernetes.io/controller-uid: 61f85cbe-b233-4eb1-9b49-e4864b4ed1f7
    suspend: false
    template:
      metadata:
        labels:
          app: debezium-connector-register
          batch.kubernetes.io/controller-uid: 61f85cbe-b233-4eb1-9b49-e4864b4ed1f7
          batch.kubernetes.io/job-name: debezium-connector-register
          controller-uid: 61f85cbe-b233-4eb1-9b49-e4864b4ed1f7
          job-name: debezium-connector-register
      spec:
        containers:
        - command:
          - sh
          - -c
          - |
            set -eu
            echo "Waiting for kafka-connect REST API..."
            attempt=0
            max_attempts=36 # 36 * 5s = 3m
            until curl --fail --silent http://kafka-connect:8083/ > /dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "FAIL: kafka-connect never became reachable after ${max_attempts} attempts" >&2
                exit 1
              fi
              sleep 5
            done
            for f in /connectors/*.json; do
              name=$(basename "$f" .json)
              echo "Registering $name..."
              # PUT .../connectors/{name}/config is idempotent (create
              # or update) - unlike POST /connectors, which 409s if the
              # connector already exists. Matters because this Job can
              # retry (backoffLimit) or be re-applied.
              curl --fail --silent --show-error \
                -X PUT \
                -H "Content-Type: application/json" \
                --data "@$f" \
                "http://kafka-connect:8083/connectors/$name/config"
              echo
            done

            # TD-22: inventory no longer publishes; remove its retired
            # connector from existing clusters. 404 means already gone.
            echo "Removing retired inventory-outbox-connector..."
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -X DELETE \
              "http://kafka-connect:8083/connectors/inventory-outbox-connector")
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              echo "FAIL: deleting inventory-outbox-connector returned $code" >&2
              exit 1
            fi
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          name: register
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /connectors
            name: connectors
        dnsPolicy: ClusterFirst
        restartPolicy: OnFailure
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - configMap:
            defaultMode: 420
            name: debezium-outbox-connectors
          name: connectors
  status:
    completionTime: "2026-11-14T18:45:59Z"
    conditions:
    - lastProbeTime: "2026-11-14T18:45:59Z"
      lastTransitionTime: "2026-11-14T18:45:59Z"
